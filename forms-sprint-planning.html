<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forms Sprint Planning - Themed Story Groups</title>
<style>
  :root {
    --color-bg: #f5f5f5;
    --color-card: #ffffff;
    --color-primary: #003e73;
    --color-secondary: #005ea2;
    --color-accent: #e31c3d;
    --color-success: #2e8540;
    --color-warning: #fdb81e;
    --color-info: #02bfe7;
    --color-muted: #71767a;
    --color-border: #dfe1e2;
    --shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Source Sans Pro', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--color-bg); color: #1b1b1b; line-height: 1.5; }
  .header { background: var(--color-primary); color: white; padding: 24px 32px; }
  .header h1 { font-size: 28px; font-weight: 700; }
  .header p { opacity: 0.85; margin-top: 4px; font-size: 16px; }
  .summary-bar { display: flex; gap: 16px; flex-wrap: wrap; padding: 16px 32px; background: white; border-bottom: 2px solid var(--color-border); }
  .stat { text-align: center; padding: 8px 20px; border-right: 1px solid var(--color-border); }
  .stat:last-child { border-right: none; }
  .stat .num { font-size: 28px; font-weight: 700; color: var(--color-secondary); }
  .stat .label { font-size: 12px; color: var(--color-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .controls { padding: 16px 32px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .controls label { font-weight: 600; font-size: 14px; }
  .controls select, .controls input { padding: 6px 12px; border: 1px solid var(--color-border); border-radius: 4px; font-size: 14px; }
  .controls input[type="text"] { width: 260px; }
  .btn-group { display: flex; gap: 4px; }
  .btn-toggle { padding: 6px 14px; border: 1px solid var(--color-border); background: white; cursor: pointer; font-size: 13px; border-radius: 4px; }
  .btn-toggle.active { background: var(--color-secondary); color: white; border-color: var(--color-secondary); }
  .content { padding: 16px 32px 48px; }
  .theme-group { margin-bottom: 28px; }
  .theme-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--color-primary); color: white; border-radius: 8px 8px 0 0; cursor: pointer; user-select: none; }
  .theme-header:hover { background: #004d8a; }
  .theme-header h2 { font-size: 18px; flex: 1; }
  .theme-header .badge { background: rgba(255,255,255,0.2); padding: 2px 10px; border-radius: 12px; font-size: 13px; }
  .theme-header .pts { background: var(--color-warning); color: #1b1b1b; padding: 2px 10px; border-radius: 12px; font-size: 13px; font-weight: 700; }
  .theme-header .chevron { font-size: 18px; transition: transform 0.2s; }
  .theme-header.collapsed .chevron { transform: rotate(-90deg); }
  .theme-body { border: 1px solid var(--color-border); border-top: none; border-radius: 0 0 8px 8px; overflow: hidden; }
  .theme-body.hidden { display: none; }
  .story-row { display: grid; grid-template-columns: 50px 1fr 100px 90px 80px 70px; align-items: center; padding: 10px 16px; border-bottom: 1px solid #f0f0f0; background: white; font-size: 14px; transition: background 0.15s; }
  .story-row:hover { background: #f0f7ff; }
  .story-row:last-child { border-bottom: none; }
  .story-row .idx { color: var(--color-muted); font-size: 12px; font-weight: 600; }
  .story-row .title a { color: var(--color-secondary); text-decoration: none; font-weight: 600; }
  .story-row .title a:hover { text-decoration: underline; }
  .story-row .assignee { font-size: 12px; color: var(--color-muted); }
  .story-row .sprint { font-size: 12px; }
  .story-row .points { text-align: center; }
  .story-row .status-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
  .status-in-progress { background: #d4edda; color: #155724; }
  .status-ready { background: #cce5ff; color: #004085; }
  .status-needs-review { background: #fff3cd; color: #856404; }
  .status-blocked { background: #f8d7da; color: #721c24; }
  .status-plan { background: #e2e3e5; color: #383d41; }
  .status-pr-review { background: #d1ecf1; color: #0c5460; }
  .status-qa { background: #d4edda; color: #155724; }
  .status-icebox { background: #e2e3e5; color: #71767a; }
  .points-chip { display: inline-block; width: 28px; height: 28px; line-height: 28px; text-align: center; border-radius: 50%; font-weight: 700; font-size: 13px; }
  .pts-1 { background: #d4edda; color: #155724; }
  .pts-2 { background: #cce5ff; color: #004085; }
  .pts-3 { background: #fff3cd; color: #856404; }
  .pts-5 { background: #f8d7da; color: #721c24; }
  .notes-icon { cursor: help; color: var(--color-info); font-size: 14px; }
  .priority-flag { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 3px; margin-left: 6px; }
  .p1 { background: #e31c3d; color: white; }
  .p2 { background: #fdb81e; color: #1b1b1b; }
  .p3 { background: #e2e3e5; color: #383d41; }
  .sprint-filter-bar { display: flex; gap: 6px; flex-wrap: wrap; }
  .sprint-btn { padding: 4px 12px; border: 1px solid var(--color-border); background: white; border-radius: 16px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .sprint-btn.active { background: var(--color-secondary); color: white; border-color: var(--color-secondary); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; padding: 8px 32px; font-size: 12px; color: var(--color-muted); border-bottom: 1px solid var(--color-border); background: white; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
  @media (max-width: 900px) {
    .story-row { grid-template-columns: 40px 1fr 80px 70px; }
    .story-row .assignee, .story-row .sprint { display: none; }
    .controls { flex-direction: column; }
  }
  @media print {
    .controls { display: none; }
    .theme-body.hidden { display: block !important; }
    .story-row { font-size: 12px; padding: 6px 12px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>Forms Sprint Planning Dashboard</h1>
  <p>Design System & Forms Team | Stories Grouped by Theme for Estimation</p>
</div>

<div class="summary-bar">
  <div class="stat"><div class="num" id="totalStories">0</div><div class="label">Total Stories</div></div>
  <div class="stat"><div class="num" id="totalPoints">0</div><div class="label">Est. Points</div></div>
  <div class="stat"><div class="num" id="unestimated">0</div><div class="label">Need Estimation</div></div>
  <div class="stat"><div class="num" id="themeCount">0</div><div class="label">Themes</div></div>
  <div class="stat"><div class="num" id="blockedCount">0</div><div class="label">Blocked</div></div>
  <div class="stat"><div class="num" id="inProgressCount">0</div><div class="label">In Progress</div></div>
</div>


<div class="controls">
  <label>Sprint:</label>
  <div class="sprint-filter-bar" id="sprintFilter">
    <button class="sprint-btn active" data-sprint="all">All</button>
    <button class="sprint-btn" data-sprint="Sprint 25">S25</button>
    <button class="sprint-btn" data-sprint="Sprint 26">S26</button>
    <button class="sprint-btn" data-sprint="Sprint 27">S27</button>
    <button class="sprint-btn" data-sprint="Sprint 28">S28</button>
    <button class="sprint-btn" data-sprint="Backlog">Backlog</button>
  </div>
  <label>Status:</label>
  <select id="statusFilter">
    <option value="all">All Statuses</option>
    <option value="In Progress">In Progress</option>
    <option value="Ready for work">Ready for Work</option>
    <option value="Needs Review">Needs Review</option>
    <option value="Plan & prioritize">Plan & Prioritize</option>
    <option value="Blocked">Blocked</option>
    <option value="PR review">PR Review</option>
    <option value="QA">QA</option>
  </select>
  <label>Search:</label>
  <input type="text" id="searchBox" placeholder="Filter by title, assignee, label...">
  <button class="btn-toggle" id="unestimatedOnly">Show Unestimated Only</button>
</div>

<div class="legend">
  <div class="legend-item"><span class="legend-dot" style="background:#d4edda"></span> In Progress / QA</div>
  <div class="legend-item"><span class="legend-dot" style="background:#cce5ff"></span> Ready for Work</div>
  <div class="legend-item"><span class="legend-dot" style="background:#fff3cd"></span> Needs Review</div>
  <div class="legend-item"><span class="legend-dot" style="background:#f8d7da"></span> Blocked</div>
  <div class="legend-item"><span class="legend-dot" style="background:#d1ecf1"></span> PR Review</div>
  <div class="legend-item"><span class="legend-dot" style="background:#e2e3e5"></span> Plan / Icebox</div>
  <div class="legend-item"><span class="priority-flag p1">P1</span> Critical</div>
  <div class="legend-item"><span class="priority-flag p2">P2</span> High</div>
  <div class="legend-item"><span class="priority-flag p3">P3</span> Medium</div>
</div>

<div class="content" id="content"></div>

// Render
function getStatusClass(status) {
  const map = {
    "In Progress": "status-in-progress",
    "Ready for work": "status-ready",
    "Needs Review": "status-needs-review",
    "Blocked": "status-blocked",
    "Plan & prioritize": "status-plan",
    "PR review": "status-pr-review",
    "QA": "status-qa",
    "Icebox": "status-icebox",
  };
  return map[status] || "status-plan";
}

function getPointsClass(pts) {
  if (!pts) return "";
  return `pts-${pts}`;
}

  const sprintVal = document.querySelector('.sprint-btn.active')?.dataset.sprint || 'all';
  const statusVal = document.getElementById('statusFilter').value;
  const search = document.getElementById('searchBox').value.toLowerCase();
  const unestOnly = document.getElementById('unestimatedOnly').classList.contains('active');

  let filtered = stories.filter(s => {
    if (sprintVal !== 'all') {
      if (sprintVal === 'Backlog' && s.sprint) return false;
      if (sprintVal !== 'Backlog' && s.sprint !== sprintVal) return false;
    }
    if (statusVal !== 'all' && s.status !== statusVal) return false;
    if (search && !(s.title.toLowerCase().includes(search) || s.assignee.toLowerCase().includes(search) || s.labels.toLowerCase().includes(search) || s.theme.toLowerCase().includes(search))) return false;
    if (unestOnly && s.points != null) return false;
    return true;
  });

  // Group by theme
  const groups = {};
  filtered.forEach(s => {
    if (!groups[s.theme]) groups[s.theme] = [];
    groups[s.theme].push(s);
  });

  let totalPts = 0, unest = 0, blocked = 0, inProg = 0;
  filtered.forEach(s => {
    if (s.points) totalPts += s.points; else unest++;
    if (s.status === 'Blocked') blocked++;
    if (s.status === 'In Progress') inProg++;
  });

  document.getElementById('totalStories').textContent = filtered.length;
  document.getElementById('totalPoints').textContent = totalPts;
  document.getElementById('unestimated').textContent = unest;
  document.getElementById('themeCount').textContent = Object.keys(groups).length;
  document.getElementById('blockedCount').textContent = blocked;
  document.getElementById('inProgressCount').textContent = inProg;

  const content = document.getElementById('content');
  content.innerHTML = '';
  let idx = 0;

  // P1 callout at top
  const p1Items = filtered.filter(s => s.priority === "P1");
  if (p1Items.length > 0) {
    const p1Box = document.createElement('div');
    p1Box.style.cssText = 'background:#fdf0f0;border:2px solid #e31c3d;border-radius:8px;padding:16px 20px;margin-bottom:24px;';
    let p1Html = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;"><span class="priority-flag p1" style="font-size:14px;padding:3px 10px;">P1</span><strong style="font-size:16px;color:#b50d0d;">Critical Priority Items (' + p1Items.length + ')</strong></div>';
    p1Items.forEach(s => {
      p1Html += '<div style="padding:6px 0;border-bottom:1px solid #f5d5d5;font-size:14px;"><a href="' + s.url + '" target="_blank" rel="noopener" style="color:#b50d0d;font-weight:600;text-decoration:none;">' + s.title + '</a> <span style="color:#71767a;font-size:12px;">(' + s.theme + ')</span></div>';
    });
    p1Box.innerHTML = p1Html;
    content.appendChild(p1Box);
  }

  // Priority sort order: P1 first, then P2, P3, then unprioritized
  const prioOrder = {"P1": 0, "P2": 1, "P3": 2, "": 3};

  Object.entries(groups).forEach(([theme, items]) => {
    items.sort((a, b) => (prioOrder[a.priority] ?? 3) - (prioOrder[b.priority] ?? 3));
    const themePts = items.reduce((a, s) => a + (s.points || 0), 0);
    const themeUnest = items.filter(s => !s.points).length;
    const themeP1s = items.filter(s => s.priority === "P1").length;

    const group = document.createElement('div');
    group.className = 'theme-group';

    const header = document.createElement('div');
    header.className = 'theme-header';
    header.innerHTML = `
      <span class="chevron">&#9660;</span>
      <h2>${theme}</h2>
      ${themeP1s ? '<span class="badge" style="background:#e31c3d;color:white;font-weight:700">' + themeP1s + ' P1</span>' : ''}
      <span class="badge">${items.length} stories</span>
      <span class="pts">${themePts} pts${themeUnest ? ' + ' + themeUnest + ' unest.' : ''}</span>
    `;
    header.addEventListener('click', () => {
      header.classList.toggle('collapsed');
      body.classList.toggle('hidden');
    });

    const body = document.createElement('div');
    body.className = 'theme-body';

    items.forEach(s => {
      idx++;
      const row = document.createElement('div');
      row.className = 'story-row';
      row.innerHTML = `
        <div class="idx">#${idx}</div>
        <div class="title">
          <a href="${s.url}" target="_blank" rel="noopener">${s.title}</a>
          ${s.priority ? `<span class="priority-flag ${s.priority.toLowerCase()}">${s.priority}</span>` : ''}
          ${s.notes ? `<span class="notes-icon" title="${s.notes.replace(/"/g, '&quot;')}">&#128221;</span>` : ''}
        </div>
        <div class="assignee">${s.assignee || '<em>unassigned</em>'}</div>
        <div class="sprint">${s.sprint || 'Backlog'}</div>
        <div class="points">${s.points ? `<span class="points-chip ${getPointsClass(s.points)}">${s.points}</span>` : '<span style="color:#aaa">--</span>'}</div>
        <div><span class="status-badge ${getStatusClass(s.status)}">${s.status === 'Plan & prioritize' ? 'Plan' : s.status}</span></div>
      `;
      body.appendChild(row);
    });

    group.appendChild(header);
    group.appendChild(body);
    content.appendChild(group);
  });
}

// Event listeners
document.querySelectorAll('.sprint-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sprint-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});
document.getElementById('statusFilter').addEventListener('change', render);
document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('unestimatedOnly').addEventListener('click', function() {
  this.classList.toggle('active');
  render();
});

render();
</script>
</body>
</html>
