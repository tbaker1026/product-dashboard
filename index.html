<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e9ecef;
        }

        .header h1 {
            color: #2d3748;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
        }

        .repo-config {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: #e8f5e8;
            border-radius: 15px;
            border: 2px solid #28a745;
        }

        .repo-config h3 {
            grid-column: 1 / -1;
            color: #2d3748;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .load-btn {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .load-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(40, 167, 69, 0.3);
        }

        .load-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loading {
            color: #6c757d;
            font-style: italic;
        }

        .error {
            color: #dc3545;
            font-weight: 600;
        }

        .multi-select-container {
            position: relative;
            min-width: 200px;
        }

        .multi-select-dropdown {
            position: relative;
            width: 100%;
        }

        .multi-select-display {
            padding: 8px 12px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .multi-select-display:hover {
            border-color: #667eea;
        }

        .multi-select-display.active {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .multi-select-display::after {
            content: "▼";
            font-size: 10px;
            color: #6c757d;
            transition: transform 0.3s ease;
        }

        .multi-select-display.active::after {
            transform: rotate(180deg);
        }

        .multi-select-options {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #e9ecef;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .multi-select-options.show {
            display: block;
        }

        .multi-select-option {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            border-bottom: 1px solid #f8f9fa;
        }

        .multi-select-option:hover {
            background-color: #f8f9fa;
        }

        .multi-select-option:last-child {
            border-bottom: none;
        }

        .multi-select-option input[type="checkbox"] {
            margin-right: 8px;
            cursor: pointer;
        }

        .multi-select-option label {
            cursor: pointer;
            margin: 0;
            flex-grow: 1;
            font-size: 14px;
        }

        .label-count {
            color: #6c757d;
            font-size: 12px;
            margin-left: 8px;
        }

        .selected-labels {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }

        .selected-label {
            background: #667eea;
            color: white;
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
        }

        .days-to-close {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-weight: 600;
            color: #495057;
            font-size: 14px;
        }

        .control-group input,
        .control-group select {
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .control-group input:focus,
        .control-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e9ecef;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            font-size: 2rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .stat-card p {
            color: #6c757d;
            font-weight: 500;
        }

        .stat-card.open h3 { color: #28a745; }
        .stat-card.closed h3 { color: #dc3545; }
        .stat-card.total h3 { color: #6f42c1; }

        .charts-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .resolution-chart-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e9ecef;
        }

        .chart-card h3 {
            margin-bottom: 20px;
            color: #2d3748;
            font-size: 1.25rem;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .pie-chart-container {
            position: relative;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .issues-list {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e9ecef;
        }

        .issues-list h3 {
            margin-bottom: 20px;
            color: #2d3748;
            font-size: 1.25rem;
        }

        .list-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .list-controls select {
            padding: 8px 12px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-size: 14px;
        }

        .issue-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #dee2e6;
            transition: all 0.3s ease;
        }

        .issue-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .issue-item.open {
            border-left-color: #28a745;
        }

        .issue-item.closed {
            border-left-color: #dc3545;
        }

        .issue-title {
            font-weight: 600;
            color: #2d3748;
            flex-grow: 1;
        }

        .issue-meta {
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 14px;
            color: #6c757d;
        }

        .issue-status {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .issue-status.open {
            background: #d4edda;
            color: #155724;
        }

        .issue-status.closed {
            background: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 768px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
            
            .resolution-chart-container {
                grid-template-columns: 1fr;
            }
            
            .controls {
                grid-template-columns: 1fr;
            }
            
            .header {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }
            
            .issue-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <script>
        // GitHub API Integration Class
        class GitHubDashboard {
            constructor() {
                this.owner = '';
                this.repo = '';
                this.token = null;
                this.baseURL = 'https://api.github.com';
                this.rateLimitRemaining = null;
                this.rateLimitReset = null;
            }

            async makeRequest(endpoint, options = {}) {
                const headers = {
                    'Accept': 'application/vnd.github.v3+json',
                    ...options.headers
                };
                
                if (this.token) {
                    headers['Authorization'] = `token ${this.token}`;
                }

                try {
                    const response = await fetch(`${this.baseURL}${endpoint}`, {
                        ...options,
                        headers
                    });
                    
                    // Update rate limit info
                    this.rateLimitRemaining = response.headers.get('X-RateLimit-Remaining');
                    this.rateLimitReset = response.headers.get('X-RateLimit-Reset');
                    
                    if (!response.ok) {
                        if (response.status === 403 && this.rateLimitRemaining === '0') {
                            const resetTime = new Date(this.rateLimitReset * 1000);
                            throw new Error(`Rate limit exceeded. Resets at ${resetTime.toLocaleTimeString()}`);
                        }
                        throw new Error(`GitHub API error: ${response.status} ${response.statusText}`);
                    }
                    
                    return await response.json();
                } catch (error) {
                    console.error('GitHub API request failed:', error);
                    throw error;
                }
            }

            async getIssues() {
                if (!this.owner || !this.repo) {
                    throw new Error('Repository owner and name must be specified');
                }

                // Fetch multiple pages to get more issues
                let allIssues = [];
                let page = 1;
                const perPage = 100;
                
                while (page <= 3) { // Limit to 3 pages (300 issues max)
                    try {
                        const issues = await this.makeRequest(
                            `/repos/${this.owner}/${this.repo}/issues?state=all&per_page=${perPage}&page=${page}&sort=created&direction=desc`
                        );
                        
                        if (issues.length === 0) break;
                        allIssues.push(...issues);
                        
                        if (issues.length < perPage) break;
                        page++;
                    } catch (error) {
                        if (page === 1) throw error; // If first page fails, throw error
                        break; // If subsequent pages fail, just use what we have
                    }
                }

                return allIssues
                    .filter(issue => !issue.pull_request) // Exclude pull requests
                    .map(issue => ({
                        id: issue.number,
                        title: issue.title,
                        status: issue.state,
                        date: issue.created_at.split('T')[0],
                        closed_at: issue.closed_at ? issue.closed_at.split('T')[0] : null,
                        labels: issue.labels.map(label => label.name),
                        url: issue.html_url,
                        author: issue.user.login,
                        assignees: issue.assignees ? issue.assignees.map(a => a.login) : [],
                        milestone: issue.milestone ? issue.milestone.title : null,
                        body: issue.body ? issue.body.substring(0, 200) + '...' : '',
                        comments: issue.comments
                    }));
            }

            async getRepoStats() {
                const repo = await this.makeRequest(`/repos/${this.owner}/${this.repo}`);
                return {
                    name: repo.full_name,
                    description: repo.description,
                    stars: repo.stargazers_count,
                    forks: repo.forks_count,
                    openIssues: repo.open_issues_count,
                    language: repo.language,
                    createdAt: repo.created_at.split('T')[0],
                    updatedAt: repo.updated_at.split('T')[0]
                };
            }

            setRepository(owner, repo, token = null) {
                this.owner = owner;
                this.repo = repo;
                this.token = token;
            }
        }

            { id: 4520, title: "Step 6: Card component error state - Documentation", status: "open", date: "2025-07-16", closed_at: null, labels: ["platform-design-system-team", "va-card"], url: "https://github.com/department-of-veterans-affairs/vets-design-system-documentation/issues/4520", author: "caw310", comments: 0, body: "## Description Update documentation and guidance for Card component error state on design.va.gov. When adding a new component, use the [component documentation template](https://github.com/department-" }
        ];

        // Global variables
        const gitHubDashboard = new GitHubDashboard();
        let allIssues = [...sampleIssues];
        let filteredIssues = [...sampleIssues];
        let lineChart, pieChart, resolutionChart;
        let currentRepo = null;
        let selectedLabels = [];

        async function loadRepositoryData() {
            const owner = document.getElementById('repoOwner').value.trim();
            const repo = document.getElementById('repoName').value.trim();
            const token = document.getElementById('githubToken').value.trim() || null;
            const loadBtn = document.getElementById('loadRepoBtn');
            const statusDiv = document.getElementById('loadStatus');
            
            if (!owner || !repo) {
                statusDiv.innerHTML = '<div class="error">❌ Please enter both repository owner and name</div>';
                return;
            }
            
            loadBtn.disabled = true;
            loadBtn.textContent = '⏳ Loading...';
            statusDiv.innerHTML = '<div class="loading">📡 Fetching repository data...</div>';
            
            try {
                gitHubDashboard.setRepository(owner, repo, token);
                
                // Fetch issues and repo stats in parallel
                const [issues, repoStats] = await Promise.all([
                    gitHubDashboard.getIssues(),
                    gitHubDashboard.getRepoStats()
                ]);
                
                allIssues = issues;
                currentRepo = repoStats;
                
                // Update header with repo info
                document.querySelector('.header h1').innerHTML = 
                    `📊 ${repoStats.name} Dashboard`;
                
                // Update label filter options based on actual labels
                updateLabelFilter();
                
                // Apply current filters
                filterIssues();
                
                statusDiv.innerHTML = `
                    <div style="color: #28a745; font-weight: 600;">
                        ✅ Loaded ${issues.length} issues from ${repoStats.name}
                        <br><small>⭐ ${repoStats.stars} stars | 🍴 ${repoStats.forks} forks | 📝 ${repoStats.openIssues} open issues</small>
                        ${gitHubDashboard.rateLimitRemaining ? `<br><small>🔄 API Rate Limit: ${gitHubDashboard.rateLimitRemaining} remaining</small>` : ''}
                    </div>
                `;
                
            } catch (error) {
                console.error('Failed to load repository data:', error);
                statusDiv.innerHTML = `<div class="error">❌ ${error.message}</div>`;
                
                // Fall back to sample data
                allIssues = [...sampleIssues];
                currentRepo = null;
                filterIssues();
            } finally {
                loadBtn.disabled = false;
                loadBtn.textContent = '📊 Load Repository Data';
            }
        }
        
        function updateLabelFilter() {
            const labelFilter = document.getElementById('labelFilter');
            const allLabels = new Set();
            
            allIssues.forEach(issue => {
                issue.labels.forEach(label => allLabels.add(label));
            });
            
            // Keep existing options and add new ones
            const existingOptions = Array.from(labelFilter.options).map(opt => opt.value);
            
            Array.from(allLabels)
                .sort()
                .forEach(label => {
                    if (!existingOptions.includes(label)) {
                        const option = document.createElement('option');
                        option.value = label;
                        option.textContent = label;
                        labelFilter.appendChild(option);
                    }
                });
                
            // Also update the multi-select dropdown
            updateMultiSelectLabels();
        }
        
        function updateMultiSelectLabels() {
            const allLabels = new Set();
            const labelCounts = {};
            
            filteredIssues.forEach(issue => {
                issue.labels.forEach(label => {
                    allLabels.add(label);
                    labelCounts[label] = (labelCounts[label] || 0) + 1;
                });
            });
            
            const labelMultiOptions = document.getElementById('labelMultiOptions');
            labelMultiOptions.innerHTML = '';
            
            // Add "Clear All" option
            const clearAllOption = document.createElement('div');
            clearAllOption.className = 'multi-select-option';
            clearAllOption.innerHTML = `
                <input type="checkbox" id="clearAll" ${selectedLabels.length === 0 ? 'checked' : ''}>
                <label for="clearAll" style="font-weight: 600; color: #dc3545;">Clear All</label>
            `;
            labelMultiOptions.appendChild(clearAllOption);
            
            // Add separator
            const separator = document.createElement('div');
            separator.style.borderTop = '1px solid #e9ecef';
            separator.style.margin = '4px 0';
            labelMultiOptions.appendChild(separator);
            
            // Add label options
            Array.from(allLabels)
                .sort()
                .forEach(label => {
                    const option = document.createElement('div');
                    option.className = 'multi-select-option';
                    const isSelected = selectedLabels.includes(label);
                    option.innerHTML = `
                        <input type="checkbox" id="label-${label}" ${isSelected ? 'checked' : ''}>
                        <label for="label-${label}">${label}</label>
                        <span class="label-count">(${labelCounts[label]})</span>
                    `;
                    labelMultiOptions.appendChild(option);
                });
        }
        
        function initializeMultiSelect() {
            const multiSelectDisplay = document.getElementById('labelMultiDisplay');
            const multiSelectOptions = document.getElementById('labelMultiOptions');
            
            // Toggle dropdown
            multiSelectDisplay.addEventListener('click', (e) => {
                e.stopPropagation();
                multiSelectOptions.classList.toggle('show');
                multiSelectDisplay.classList.toggle('active');
            });
            
            // Close dropdown when clicking outside
            document.addEventListener('click', (e) => {
                if (!document.getElementById('labelMultiSelect').contains(e.target)) {
                    multiSelectOptions.classList.remove('show');
                    multiSelectDisplay.classList.remove('active');
                }
            });
            
            // Handle option selection
            multiSelectOptions.addEventListener('change', (e) => {
                if (e.target.type === 'checkbox') {
                    if (e.target.id === 'clearAll') {
                        selectedLabels = [];
                        updateMultiSelectLabels();
                    } else {
                        const label = e.target.id.replace('label-', '');
                        if (e.target.checked) {
                            if (!selectedLabels.includes(label)) {
                                selectedLabels.push(label);
                            }
                        } else {
                            selectedLabels = selectedLabels.filter(l => l !== label);
                        }
                    }
                    updateMultiSelectDisplay();
                    updateIssuesList();
                }
            });
            
            // Prevent dropdown from closing when clicking inside
            multiSelectOptions.addEventListener('click', (e) => {
                e.stopPropagation();
            });
        }
        
        function updateMultiSelectDisplay() {
            const display = document.getElementById('labelMultiDisplay');
            
            if (selectedLabels.length === 0) {
                display.innerHTML = '🏷️ Filter by Labels';
            } else {
                display.innerHTML = `
                    <div>
                        <span>🏷️ ${selectedLabels.length} label${selectedLabels.length > 1 ? 's' : ''} selected</span>
                        <div class="selected-labels">
                            ${selectedLabels.slice(0, 3).map(label => 
                                `<span class="selected-label">${label}</span>`
                            ).join('')}
                            ${selectedLabels.length > 3 ? `<span class="selected-label">+${selectedLabels.length - 3}</span>` : ''}
                        </div>
                    </div>
                `;
            }
        }

        function calculateDaysToClose(issue) {
            if (issue.status !== 'closed' || !issue.closed_at) {
                return null;
            }
            
            const openDate = new Date(issue.date);
            const closeDate = new Date(issue.closed_at);
            const timeDiff = closeDate - openDate;
            const daysDiff = Math.ceil(timeDiff / (1000 * 3600 * 24));
            
            return daysDiff;
        }

        function formatDaysToClose(days) {
            if (days === null) return '';
            if (days === 0) return '🚀 Same day';
            if (days === 1) return '⚡ 1 day';
            if (days <= 7) return `⚡ ${days} days`;
            if (days <= 30) return `📅 ${days} days`;
            return `🐌 ${days} days`;
        }

        function filterIssues() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const statusFilter = document.getElementById('statusFilter').value;
            const labelFilter = document.getElementById('labelFilter').value;

            filteredIssues = allIssues.filter(issue => {
                const issueDate = new Date(issue.date);
                const start = new Date(startDate);
                const end = new Date(endDate);
                
                const dateMatch = issueDate >= start && issueDate <= end;
                const statusMatch = statusFilter === 'all' || issue.status === statusFilter;
                const labelMatch = labelFilter === 'all' || issue.labels.includes(labelFilter);
                
                return dateMatch && statusMatch && labelMatch;
            });

            updateDashboard();
        }

        function updateStats() {
            const openCount = filteredIssues.filter(i => i.status === 'open').length;
            const closedCount = filteredIssues.filter(i => i.status === 'closed').length;
            const totalCount = filteredIssues.length;
            const closureRate = totalCount > 0 ? Math.round((closedCount / totalCount) * 100) : 0;

            document.getElementById('openCount').textContent = openCount;
            document.getElementById('closedCount').textContent = closedCount;
            document.getElementById('totalCount').textContent = totalCount;
            document.getElementById('closureRate').textContent = closureRate + '%';
        }

        function updateLineChart() {
            const ctx = document.getElementById('lineChart').getContext('2d');
            
            // Group issues by date
            const dateGroups = {};
            filteredIssues.forEach(issue => {
                const date = issue.date;
                if (!dateGroups[date]) {
                    dateGroups[date] = { open: 0, closed: 0 };
                }
                dateGroups[date][issue.status]++;
            });

            const sortedDates = Object.keys(dateGroups).sort();
            const openData = sortedDates.map(date => dateGroups[date].open);
            const closedData = sortedDates.map(date => dateGroups[date].closed);

            if (lineChart) {
                lineChart.destroy();
            }

            lineChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: sortedDates,
                    datasets: [{
                        label: 'Open Issues',
                        data: openData,
                        borderColor: '#28a745',
                        backgroundColor: 'rgba(40, 167, 69, 0.1)',
                        tension: 0.4,
                        fill: true
                    }, {
                        label: 'Closed Issues',
                        data: closedData,
                        borderColor: '#dc3545',
                        backgroundColor: 'rgba(220, 53, 69, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    }
                }
            });
        }

        function updatePieChart() {
            const ctx = document.getElementById('pieChart').getContext('2d');
            
            const openCount = filteredIssues.filter(i => i.status === 'open').length;
            const closedCount = filteredIssues.filter(i => i.status === 'closed').length;

            if (pieChart) {
                pieChart.destroy();
            }

            pieChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Open', 'Closed'],
                    datasets: [{
                        data: [openCount, closedCount],
                        backgroundColor: ['#28a745', '#dc3545'],
                        hoverBackgroundColor: ['#34ce57', '#e85d6b'],
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                        }
                    }
                }
            });
        }

        function updateResolutionChart() {
            const ctx = document.getElementById('resolutionChart').getContext('2d');
            
            // Get only closed issues with resolution times
            const closedIssues = filteredIssues
                .filter(issue => issue.status === 'closed' && issue.closed_at)
                .map(issue => ({
                    ...issue,
                    daysToClose: calculateDaysToClose(issue),
                    closeDate: new Date(issue.closed_at)
                }))
                .filter(issue => issue.daysToClose !== null)
                .sort((a, b) => a.closeDate - b.closeDate);

            if (closedIssues.length === 0) {
                if (resolutionChart) {
                    resolutionChart.destroy();
                }
                
                // Show "No data" message
                resolutionChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['No Data'],
                        datasets: [{
                            label: 'Days to Resolution',
                            data: [0],
                            backgroundColor: '#e9ecef',
                            borderColor: '#dee2e6',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Days to Resolution'
                                }
                            },
                            x: {
                                title: {
                                    display: true,
                                    text: 'No closed issues in current filter'
                                }
                            }
                        }
                    }
                });
                return;
            }

            const labels = closedIssues.map(issue => `#${issue.id}`);
            const data = closedIssues.map(issue => issue.daysToClose);
            
            // Color code bars based on resolution speed
            const backgroundColors = data.map(days => {
                if (days === 0) return '#17a2b8'; // Same day - info blue
                if (days <= 1) return '#28a745'; // 1 day - success green
                if (days <= 7) return '#ffc107'; // 1 week - warning yellow
                if (days <= 30) return '#fd7e14'; // 1 month - orange
                return '#dc3545'; // > 1 month - danger red
            });

            if (resolutionChart) {
                resolutionChart.destroy();
            }

            resolutionChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Days to Resolution',
                        data: data,
                        backgroundColor: backgroundColors,
                        borderColor: backgroundColors.map(color => color),
                        borderWidth: 1,
                        borderRadius: 4,
                        borderSkipped: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                title: function(context) {
                                    const index = context[0].dataIndex;
                                    const issue = closedIssues[index];
                                    return `Issue ${issue.id}: ${issue.title}`;
                                },
                                label: function(context) {
                                    const days = context.parsed.y;
                                    if (days === 0) return 'Resolved same day';
                                    if (days === 1) return 'Resolved in 1 day';
                                    return `Resolved in ${days} days`;
                                },
                                afterLabel: function(context) {
                                    const index = context.dataIndex;
                                    const issue = closedIssues[index];
                                    return [`Opened: ${issue.date}`, `Closed: ${issue.closed_at}`];
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Days to Resolution'
                            },
                            ticks: {
                                stepSize: 1
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Issues (sorted by close date)'
                            },
                            ticks: {
                                maxRotation: 45,
                                minRotation: 45
                            }
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    }
                }
            });
        }

        function updateIssuesList() {
            const listStatusFilter = document.getElementById('listStatusFilter').value;
            const sortBy = document.getElementById('sortBy').value;
            const sortOrder = document.getElementById('sortOrder').value;
            
            // Apply list-specific status filter
            let listFilteredIssues = [...filteredIssues];
            if (listStatusFilter !== 'all') {
                listFilteredIssues = filteredIssues.filter(issue => issue.status === listStatusFilter);
            }
            
            // Apply multi-select label filter
            if (selectedLabels.length > 0) {
                listFilteredIssues = listFilteredIssues.filter(issue => 
                    selectedLabels.some(selectedLabel => issue.labels.includes(selectedLabel))
                );
            }
            
            const sortedIssues = [...listFilteredIssues].sort((a, b) => {
                let aVal, bVal;
                
                switch(sortBy) {
                    case 'date':
                        aVal = new Date(a.date);
                        bVal = new Date(b.date);
                        break;
                    case 'title':
                        aVal = a.title.toLowerCase();
                        bVal = b.title.toLowerCase();
                        break;
                    case 'status':
                        aVal = a.status;
                        bVal = b.status;
                        break;
                }
                
                if (sortOrder === 'asc') {
                    return aVal > bVal ? 1 : -1;
                } else {
                    return aVal < bVal ? 1 : -1;
                }
            });

            const issuesList = document.getElementById('issuesList');
            issuesList.innerHTML = sortedIssues.map(issue => {
                const daysToClose = calculateDaysToClose(issue);
                const daysDisplay = formatDaysToClose(daysToClose);
                
                return `
                    <div class="issue-item ${issue.status}">
                        <div class="issue-title">
                            ${issue.url ? `<a href="${issue.url}" target="_blank" style="color: inherit; text-decoration: none;">#${issue.id} ${issue.title}</a>` : `#${issue.id} ${issue.title}`}
                        </div>
                        <div class="issue-meta">
                            <span class="issue-status ${issue.status}">${issue.status}</span>
                            <span>${issue.date}</span>
                            ${issue.author ? `<span>👤 ${issue.author}</span>` : ''}
                            ${issue.labels.length > 0 ? `<span>🏷️ ${issue.labels.slice(0, 3).join(', ')}${issue.labels.length > 3 ? '...' : ''}</span>` : ''}
                            ${issue.comments ? `<span>💬 ${issue.comments}</span>` : ''}
                            ${daysDisplay ? `<span class="days-to-close">${daysDisplay}</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateDashboard() {
            updateStats();
            updateLineChart();
            updatePieChart();
            updateResolutionChart();
            updateIssuesList();
            document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();
        }

        // Event listeners
        document.getElementById('loadRepoBtn').addEventListener('click', loadRepositoryData);
        document.getElementById('startDate').addEventListener('change', filterIssues);
        document.getElementById('endDate').addEventListener('change', filterIssues);
        document.getElementById('statusFilter').addEventListener('change', filterIssues);
        document.getElementById('labelFilter').addEventListener('change', filterIssues);
        document.getElementById('listStatusFilter').addEventListener('change', updateIssuesList);
        document.getElementById('sortBy').addEventListener('change', updateIssuesList);
        document.getElementById('sortOrder').addEventListener('change', updateIssuesList);
        
        // Allow Enter key to trigger load
        ['repoOwner', 'repoName', 'githubToken'].forEach(id => {
            document.getElementById(id).addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    loadRepositoryData();
                }
            });
        });

        // Initialize dashboard with sample data
        updateDashboard();
        
        // Initialize multi-select functionality
        initializeMultiSelect();
        
        // Set default date range to show more recent data
        const today = new Date();
        const oneYearAgo = new Date(today.getFullYear() - 1, today.getMonth(), today.getDate());
        document.getElementById('startDate').value = oneYearAgo.toISOString().split('T')[0];
        document.getElementById('endDate').value = today.toISOString().split('T')[0];
        
        // Show initial instructions
        document.getElementById('loadStatus').innerHTML = `
            <div style="color: #6c757d; font-style: italic;">
                💡 Enter a GitHub repository above and click "Load Repository Data" to see real issues,<br>
                or explore the sample data that's currently displayed.
            </div>
        `;
    </script>
